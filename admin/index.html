<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>养老金融网站管理</title>
  <link rel="icon" type="image/png" href="/assets/images/home/entry-hui.png">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <section id="login-view" class="login-shell" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">养</div>
      <p class="eyebrow">工银养老金融</p>
      <h1>网站内容管理</h1>
      <p class="muted">请输入私有配置文件中设置的管理密码。</p>
      <label for="login-password">管理密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="button button-primary button-block" type="submit">登录</button>
      <p id="login-error" class="form-message error" role="alert"></p>
    </form>
  </section>

  <div id="admin-view" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">AGING FINANCE CMS</p>
        <h1>养老金融网站管理</h1>
      </div>
      <div class="topbar-actions">
        <button id="generate-button" class="button button-primary" type="button">重新生成全部网站</button>
        <button id="logout-button" class="button button-ghost" type="button">退出</button>
      </div>
    </header>

    <div id="global-message" class="global-message" role="status" aria-live="polite"></div>

    <main class="workspace">
      <aside class="panel tree-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">页面结构</p>
            <h2>页面树</h2>
          </div>
          <button id="new-page-button" class="icon-button" type="button" title="新增页面" aria-label="新增页面">+</button>
        </div>
        <nav id="page-tree" aria-label="页面树"></nav>
      </aside>

      <section class="editor-column">
        <article class="panel">
          <div class="panel-heading">
            <div>
              <p class="section-label">PAGE</p>
              <h2 id="page-form-heading">编辑页面</h2>
            </div>
            <div class="inline-actions">
              <a id="preview-link" class="button button-secondary" href="/" target="_blank" rel="noopener">查看生成页</a>
              <button id="delete-page-button" class="button button-danger" type="button">删除页面</button>
            </div>
          </div>

          <form id="page-form" class="form-grid">
            <input id="page-id" name="id" type="hidden">
            <label class="field field-wide">
              <span>页面标题</span>
              <input name="title" required maxlength="120">
            </label>
            <label class="field">
              <span>Slug</span>
              <input name="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="page-slug">
              <small>首页留空；其他页面使用小写字母、数字和连字符。</small>
            </label>
            <label class="field">
              <span>父页面</span>
              <select id="page-parent" name="parent_id"></select>
            </label>
            <label class="field">
              <span>模板</span>
              <select name="template_type" required>
                <option value="home">home</option>
                <option value="card-list">card-list</option>
                <option value="content">content</option>
                <option value="link-list">link-list</option>
              </select>
            </label>
            <label class="field">
              <span>装饰字</span>
              <input name="decorative_character" maxlength="8" placeholder="惠">
            </label>
            <label class="field field-wide">
              <span>标题图片路径</span>
              <input name="title_image" list="media-paths" placeholder="/assets/images/titles/example.png">
            </label>
            <label class="field field-wide">
              <span>背景主题或图片路径</span>
              <input name="background_image" list="media-paths" placeholder="hui 或 /uploads/example.png">
            </label>
            <label class="field field-wide">
              <span>内容（允许经过服务端清洗的安全 HTML）</span>
              <textarea name="content" rows="8" placeholder="<p>页面内容</p>"></textarea>
            </label>
            <label class="field">
              <span>排序</span>
              <input name="sort_order" type="number" value="0">
            </label>
            <label class="field">
              <span>状态</span>
              <select name="status">
                <option value="published">已发布</option>
                <option value="draft">草稿</option>
              </select>
            </label>
            <div class="form-actions field-wide">
              <button class="button button-primary" type="submit">保存页面并重新生成</button>
              <span id="page-form-message" class="form-message" role="status"></span>
            </div>
          </form>
        </article>

        <article id="cards-panel" class="panel">
          <div class="panel-heading">
            <div>
              <p class="section-label">LINKS</p>
              <h2>Card 与文字链接</h2>
            </div>
            <button id="new-card-button" class="button button-secondary" type="button">新增 Card</button>
          </div>
          <div id="card-list" class="admin-card-list"></div>

          <form id="card-form" class="form-grid card-editor" hidden>
            <input name="id" type="hidden">
            <label class="field">
              <span>类型</span>
              <select name="item_type">
                <option value="image_card">图文 Card</option>
                <option value="text_link">文字链接</option>
              </select>
            </label>
            <label class="field">
              <span>状态</span>
              <select name="status">
                <option value="published">已发布</option>
                <option value="draft">草稿</option>
              </select>
            </label>
            <label class="field field-wide">
              <span>标题</span>
              <input name="title" required maxlength="180">
            </label>
            <label class="field field-wide">
              <span>说明</span>
              <textarea name="description" rows="3"></textarea>
            </label>
            <label class="field field-wide">
              <span>图片路径</span>
              <div class="input-action">
                <input name="image_path" list="media-paths" placeholder="/uploads/example.png">
                <button id="upload-trigger" class="button button-secondary" type="button">上传图片</button>
                <input id="upload-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
              </div>
            </label>
            <label class="field field-wide">
              <span>图片替代文字</span>
              <input name="image_alt" maxlength="180">
            </label>
            <label class="field">
              <span>内部目标页面</span>
              <select id="card-target" name="target_page_id"></select>
            </label>
            <label class="field">
              <span>或外部 URL</span>
              <input name="external_url" type="url" placeholder="https://example.com">
            </label>
            <label class="field">
              <span>排序</span>
              <input name="sort_order" type="number" value="0">
            </label>
            <div class="form-actions field-wide">
              <button class="button button-primary" type="submit">保存 Card</button>
              <button id="cancel-card-button" class="button button-ghost" type="button">取消</button>
              <span id="card-form-message" class="form-message" role="status"></span>
            </div>
          </form>
        </article>
      </section>

      <aside class="panel media-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">MEDIA</p>
            <h2>媒体库</h2>
          </div>
        </div>
        <p class="muted compact">PNG / JPEG / WebP，最大 5 MB。替换同格式文件后会自动更新内容哈希。</p>
        <div id="media-list" class="media-list"></div>
      </aside>
    </main>
  </div>

  <datalist id="media-paths"></datalist>
  <script src="/admin/app.js" defer></script>
</body>
</html>
